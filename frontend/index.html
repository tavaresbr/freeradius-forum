<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Favicon da ultima visita (Identidade do site), aplicado antes do React para a aba nao piscar o icone padrao.
      try { var f = localStorage.getItem("favicon_url"); if (f) { var l = document.createElement("link"); l.rel = "icon"; l.href = f; document.head.appendChild(l); } } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de gerenciamento de Hotspot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
